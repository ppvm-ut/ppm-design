.scenario-panel { box-sizing:border-box; width:375px; max-width:100%; padding:16px; border:1px solid var(--stage-line); border-radius:18px; background:var(--stage-btn); font:400 13px/19px var(--font-inter); }
.scenario-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.scenario-heading button { border:1px solid var(--stage-line); border-radius:20px; background:transparent; color:inherit; padding:5px 12px; cursor:pointer; font:inherit; }
.scenario-panel label { display:block; margin-bottom:5px; color:var(--stage-muted); }
.scenario-panel select { width:100%; border:1px solid var(--stage-line); border-radius:10px; background:var(--stage-btn); color:inherit; padding:10px 8px; font:inherit; }
.scenario-panel p { margin:10px 0 0; }
.scenario-panel details { margin-top:10px; color:var(--stage-muted); font-size:12px; line-height:18px; }
.scenario-panel summary { cursor:pointer; }
.scenario-panel :focus-visible { outline:2px solid var(--border-accent); outline-offset:2px; }
[data-flow="topup"] .tp-adds { flex-direction:column; align-items:center; width:100%; }
.tp-adds-row { display:flex; justify-content:center; gap:4px; max-width:100%; }
.tp-adds-row .chip { min-width:0; padding-inline:16px; }
.tp-adds-row.is-wide .chip { padding-inline:10px; }
.tp-adds-row.is-wide .chip span { font-size:12px; }
.tp-last-purchase { display:flex; justify-content:center; }
.chip:disabled { opacity:.4; cursor:not-allowed; }
[data-flow="topup"] .cta-sub { display:flex; align-items:center; justify-content:center; gap:4px; }
@media (min-width:900px) {
 .scenario-panel { position:fixed; top:24px; left:max(24px, calc(50% - 610px)); width:320px; }
}
@media (max-width:899px) {
 .stage { padding-bottom:16px; }
 .scenario-panel { flex:none; }
}

&lt;tr&gt;&lt;td&gt;Смена карты и валюты&lt;/td&gt;&lt;td&gt;Выбор карты и USD / RUB существовали.&lt;/td&gt;&lt;td&gt;После выбора карты пересчитываются номиналы, введённая сумма сохраняется. В RUB показываются округлённые рублёвые прибавки, в том числе при пустом поле.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Максимум&lt;/td&gt;&lt;td&gt;Ошибка при сумме выше $50 000.&lt;/td&gt;&lt;td&gt;&lt;a href=&quot;https://www.figma.com/design/4NLrbX2NuiWrW1dr75K4xr?node-id=2535-4124&quot;&gt;Саджесты активны сверх максимума&lt;/a&gt;. Операция останавливается при подтверждении с сообщением о лимите. Это последнее решение дизайнера.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Визуал&lt;/td&gt;&lt;td&gt;Запятая в дробных суммах и на клавиатуре; подпись СБП без знака.&lt;/td&gt;&lt;td&gt;Десятичная точка, логотип Claude и знак СБП рядом с подписью в кнопке «Пополнить». Разряды разделяются пробелами.&lt;/td&gt;&lt;/tr&gt;

&lt;h2&gt;Как проверить&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;Выберите одну из трёх веток. Нажмите первый саджест дважды: в первой ветке получится $66, во второй — $44.&lt;/li&gt;&lt;li&gt;Нажмите Claude: сумма заменится на $20. В третьей ветке этой кнопки нет.&lt;/li&gt;&lt;li&gt;Смените валюту на RUB и карту на «Премиальная». Проверьте пересчёт и сохранение введённой суммы.&lt;/li&gt;&lt;li&gt;Введите 53 535 USD: саджесты продолжают прибавлять сумму; кнопка пополнения показывает ошибку и не запускает операцию.&lt;/li&gt;&lt;li&gt;Примените «ХАЛЯВА» либо «ХАЛЯВАЛЯВАЛЯВА» и проверьте бонус с рублёвым эквивалентом.&lt;/li&gt;&lt;li&gt;Выберите результат в панели. Для примера макета введите $105 и примените промокод: зачисление $234, баланс $339.24.&lt;/li&gt;&lt;/ol&gt;
&lt;h2&gt;Один самостоятельный файл&lt;/h2&gt;&lt;p&gt;Все сценарии прототипа, этот ченджлог, шрифты, изображения и иконки встроены в HTML. Переносите файл целиком и открывайте его в браузере — папки с ресурсами, архив и установка не нужны.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Это демонстрационный прототип: $1 = 100 ₽, фиксированная покупка Claude $20, тестовые истории и дата расчёта 11.11.2026. Ветка со старой историей и доступность саджестов сверх максимума следуют решениям дизайнера в этой задаче. Реальные платежи и серверные котировки не подключены.&lt;/p&gt;
