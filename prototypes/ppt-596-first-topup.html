:root{--stage:#e9ebef;--ink:#0a0a0f;--secondary:#464a52;--tertiary:#5e636c;--accent:#0365e3;--subtle:rgba(0,0,0,.03);--blue-soft:rgba(22,119,255,.08);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.16,1,.3,1);color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--ink);font-family:Inter,sans-serif}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit;background:none;padding:0;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1677ff;outline-offset:4px}button:active:not(:disabled){transform:scale(.98)}p,h1,h2{margin:0}img{display:block;flex:none}[hidden]{display:none!important}
.stage{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;gap:56px}.preview{flex:none}.toolbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar h1{font:600 14px/20px Onest,sans-serif}.toolbar small{display:block;font:400 12px/18px Inter;color:#6b717c}.restart{font:500 12px/20px Inter;border-radius:30px;background:white;border:1px solid #d7dae0;padding:5px 12px}.phone-wrap{width:calc(375px * var(--s,1));height:calc(812px * var(--s,1))}.phone{width:375px;height:812px;position:relative;isolation:isolate;overflow:hidden;background:#fff;border-radius:42px;box-shadow:0 0 0 1px #d5d7dc,0 24px 64px #141c2126;transform:scale(var(--s,1));transform-origin:top left;font-family:Onest,Inter,sans-serif}.screen{position:absolute;inset:0;background:white;display:flex;flex-direction:column;overflow:hidden}.sysbar{height:87px;flex:none;position:relative;z-index:2}.sys-time{position:absolute;left:46px;top:18px;font:600 15px/19px Inter;letter-spacing:-.3px;color:black}.sys-right{position:absolute;top:22px;right:37px}.tg-back{position:absolute;top:59px;left:15px;border-radius:27px;background:#00000012;height:28px;display:flex;align-items:center;gap:10px;padding:0 13px 0 11px;font:500 13px/21px Inter;letter-spacing:-.26px}.back-icon{transform:rotate(90deg);width:7px;height:12px;display:flex;align-items:center;justify-content:center}.tg-menu{position:absolute;top:59px;right:15px;cursor:default}.indicator{height:34px;background:white;position:relative;flex:none;z-index:3}.indicator:after{content:"";position:absolute;width:143px;height:5px;border-radius:100px;background:#000;bottom:8px;left:116px}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.btn{height:56px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--accent);color:#fff;font:500 18px/24px Onest;width:100%;flex:none;transition:transform .14s,background .2s}.btn.soft{background:var(--blue-soft);color:var(--accent)}.actions{display:flex;gap:8px;width:100%}.actions .btn{flex:1;min-width:0}.close{width:24px;height:24px;flex:none}.title{font:600 24px/32px Onest;letter-spacing:-.24px}.subtitle{font:400 16px/20px Onest;color:var(--tertiary)}
/* Card issue success */
.success-body{padding:16px 16px 0;align-items:flex-end}.success-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;padding-top:16px}.success-icon{width:64px;height:64px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center}.success-copy{text-align:center;width:100%}.success-copy .subtitle{margin-top:4px;color:var(--secondary)}.success-body .btn{margin-top:0}.success-hero .success-icon{animation:halo .7s var(--spring) both}.success-hero .success-icon img{animation:check .5s var(--spring) .13s both}.success-copy{animation:reveal .48s var(--ease) .16s both}.success-body>.btn{animation:reveal .48s var(--ease) .26s both}@keyframes halo{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}@keyframes check{from{transform:scale(.5) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes reveal{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Service and tariff screens */
.full-screen{background:#f5f6f7}.full-panel{margin-top:18px;border-radius:20px 20px 0 0;background:white;flex:1;padding:24px 16px 0;display:flex;flex-direction:column;gap:16px;min-height:0}.heading{display:flex;flex-direction:column;gap:8px}.option-list{display:flex;flex-direction:column}.option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:72px;padding:12px 0;font:500 18px/24px Onest;border-radius:12px;transition:background .16s}.option:hover{background:#00000002}.option-text{flex:1;min-width:0}.option-text small{display:block;font:400 14px/20px Onest;color:var(--tertiary)}.service-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;background:#fff;border:1px solid #f3f3f3}.service-icon.gpt{background:#141c21;border:0}.service-icon.claude{background:#d97757;border:0}.service-icon.apple{background:#0f0f0f;border:0}.radio{border:2px solid #898f99;width:24px;height:24px;flex:none;border-radius:50%;position:relative;transition:border-color .16s}.radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#1677ff;transform:scale(0);transition:transform .22s var(--spring)}[aria-checked=true] .radio{border-color:#75adff}[aria-checked=true] .radio:after{transform:scale(1)}.full-panel>.actions{margin-top:auto}
